ckan.datastore.write_url = postgresql://catalogo-datastore-db:Bencomo20@LOCALHOST:5432/catalogo-datastore
ckan.datastore.read_url = postgresql://catalogo-datastore-ro-db:Candelaria20@LOCALHOST:5432/catalogo-datastore

