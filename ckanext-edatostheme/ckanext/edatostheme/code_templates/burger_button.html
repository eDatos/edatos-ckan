<script>
(function() {
    let burgerMenuOpen = false;
    const burgerMenus = document.getElementsByClassName("collapsable-menu");

    function openBurgerMenu() {
        for (let menu of burgerMenus) {
            menu.classList.add("abrir");
        }
        burgerMenuOpen = true;
    }

    function closeBurgerMenu() {
        for (let menu of burgerMenus) {
            menu.classList.remove("abrir");
        }
        burgerMenuOpen = false;
    }

    window.toggleBurgerMenu = function() {
        if (burgerMenuOpen) {
            closeBurgerMenu();
        } else {
            openBurgerMenu();
        }
    };
})();
</script>

<button onclick="toggleBurgerMenu()" class="btn btn-navbar" type="button">
    <span class="fa fa-bars"></span>
</button>
