<script>
(function() {
    let burgerAbierto = false;
    const burgerMenus = document.getElementsByClassName("collapsable-menu");

    function abrir_burger() {
        for (let menu of burgerMenus) {
            menu.classList.add("abrir");
        }
        burgerAbierto = true;
    }

    function cerrar_burger() {
        for (let menu of burgerMenus) {
            menu.classList.remove("abrir");
        }
        burgerAbierto = false;
    }

    window.toggle_burger_menu = function() {
        if (burgerAbierto) {
            cerrar_burger();
        } else {
            abrir_burger();
        }
    };
})();
</script>

<button onclick="toggle_burger_menu()" class="btn btn-navbar" type="button">
    <span class="fa fa-bars"></span>
</button>
