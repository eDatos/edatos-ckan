edatostheme-css:
  output: ckanext-edatostheme/%(version)s-edatostheme_css.css
  contents:
    - styles/base.css
    - styles/custom.css
    - styles/subject-area-icons.css

edatostheme-fonts:
  output: ckanext-edatostheme/%(version)s-edatostheme_fonts.css
  contents:
    - fonts/glyphter/css/Glyphter.css

edatostheme-js:
  output: ckanext-edatostheme/%(version)s-edatostheme_js.js
  contents:
    - js/i18n.js
    - js/edatos-external-html.js
    - js/resource-view-inline-toolbar.js
