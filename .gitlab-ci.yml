stages:
  - develop
  - release
  - deploy

variables:
  CKAN_IMAGE: ${DOCKER_REGISTRY}/edatos/ckan
  WORKER_IMAGE: ${DOCKER_REGISTRY}/edatos/ckan-worker

# ── Templates ──────────────────────────────────────────────────────────────

.docker_job:
  tags: ["docker"]
  image: docker:24.0.5
  variables:
    DOCKER_HOST: ""
  services:
    - name: docker:24.0.5-dind
  before_script:
    - docker login $DOCKER_REGISTRY --username app-jenkins --password $ARTE_DOCKER_REGISTRY_PASS
  script:
    - docker build --cache-from $CKAN_IMAGE:$IMAGE_TAG
      --tag $CKAN_IMAGE:$IMAGE_TAG -f dockerfiles/ckan/Dockerfile .
    - docker push $CKAN_IMAGE:$IMAGE_TAG
    - docker build --cache-from $WORKER_IMAGE:$IMAGE_TAG
      --tag $WORKER_IMAGE:$IMAGE_TAG -f dockerfiles/ckan/Dockerfile.worker .
    - docker push $WORKER_IMAGE:$IMAGE_TAG

.trigger_ckan_stack:
  stage: deploy
  trigger:
    project: istac/infraestructura/ckan-stack
    branch: develop

# ── Jobs ───────────────────────────────────────────────────────────────────

build image:
  extends: .docker_job
  stage: develop
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    IMAGE_TAG: latest

release:
  extends: .docker_job
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_TAG
      when: manual
  variables:
    IMAGE_TAG: $CI_COMMIT_TAG

trigger ckan-stack develop:
  extends: .trigger_ckan_stack
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    VERSION: latest

trigger ckan-stack release:
  extends: .trigger_ckan_stack
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  trigger:
    strategy: depend
  variables:
    VERSION: $CI_COMMIT_TAG
