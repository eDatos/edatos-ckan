  stages:
    - build

  variables:
    DOCKER_REGISTRY: docker.arte-consultores.com

  build image:
    stage: build
    tags: ["docker"]
    rules:
       - if: $CI_PIPELINE_SOURCE == "web"
         when: manual
    image: docker:24.0.5
    variables:
      DOCKER_HOST: ""
    services:
      - name: docker:24.0.5-dind
    before_script:
      - docker login docker.arte-consultores.com --username app-jenkins --password app-jenkins
    script:
      - pwd
      - ls -la
      - find . -maxdepth 4 -type f | sort
      - docker build --cache-from docker.arte-consultores.com/edatos/ckan:latest
        --tag docker.arte-consultores.com/edatos/ckan:1.0.0 --tag docker.arte-consultores.com/edatos/ckan:latest -f dockerfiles/ckan/Dockerfile.yml .
      - docker push docker.arte-consultores.com/edatos/ckan:1.0.0
      - docker push docker.arte-consultores.com/edatos/ckan:latest
    artifacts:
      reports:
        dotenv: build.env
      expire_in: 1 hour
