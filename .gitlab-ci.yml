stages:
  - develop
  - release

variables:
  DOCKER_REGISTRY: docker.arte-consultores.com

build image:
  stage: develop
  tags: ["docker"]
  rules:
     - if: $CI_PIPELINE_SOURCE == "web"
       when: manual
  image: docker:24.0.5
  variables:
    DOCKER_HOST: ""
  services:
    - name: docker:24.0.5-dind
  before_script:
    - docker login docker.arte-consultores.com --username app-jenkins --password app-jenkins
  script:
    - docker build --cache-from docker.arte-consultores.com/edatos/ckan:latest
      --tag docker.arte-consultores.com/edatos/ckan:latest -f dockerfiles/ckan/Dockerfile .
    - docker push docker.arte-consultores.com/edatos/ckan:latest
    - docker build --cache-from docker.arte-consultores.com/edatos/ckan_jobs-worker:latest
      --tag docker.arte-consultores.com/edatos/ckan_jobs-worker:latest -f dockerfiles/ckan/Dockerfile.worker .
    - docker push docker.arte-consultores.com/edatos/ckan_jobs-worker:latest

release:
  stage: release
  tags: ["docker"]
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  image: docker:24.0.5
  variables:
    DOCKER_HOST: ""
  services:
    - name: docker:24.0.5-dind
  before_script:
    - docker login docker.arte-consultores.com --username app-jenkins --password app-jenkins
  script:
    - docker build --cache-from docker.arte-consultores.com/edatos/ckan:$CI_COMMIT_TAG
      --tag docker.arte-consultores.com/edatos/ckan:$CI_COMMIT_TAG -f dockerfiles/ckan/Dockerfile .
    - docker push docker.arte-consultores.com/edatos/ckan:$CI_COMMIT_TAG
    - docker build --cache-from docker.arte-consultores.com/edatos/ckan_jobs-worker:$CI_COMMIT_TAG
      --tag docker.arte-consultores.com/edatos/ckan_jobs-worker:$CI_COMMIT_TAG -f dockerfiles/ckan/Dockerfile.worker .
    - docker push docker.arte-consultores.com/edatos/ckan_jobs-worker:$CI_COMMIT_TAG

trigger_ckan_stack:
  stage: deploy
  rules:
     - if: $CI_PIPELINE_SOURCE == "web"
       when: manual
  trigger:
    project: istac/ckan-stack
    branch: develop
    strategy: depend