name: ckan-pg12

volumes:
  pg12_data:

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env               # reutiliza POSTGRES_*, CKAN_DB_*, DATASTORE_* del stack CKAN
    volumes:
      - pg12_data:/var/lib/postgresql/data
      - ../../../Cosas/BBDD/ckan_default.dump:/dump/ckan_default.dump:ro
    ports:
      - "5432:5432"
    networks:
      default:
        aliases:
          - db                # CKAN sigue resolviendo 'db' sin tocar su config
    restart: unless-stopped
    healthcheck:
      # Se resuelve dentro del contenedor con $$ (las variables las pone env_file, no el .env
      # del host: al usar -f en un subdirectorio, Compose no ve el .env de ../)
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  default:
    name: dockerfiles_ckan-net
    external: true
